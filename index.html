<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Why Must I Cry: Woods Escape</title>
<style>
.obstacle{
position:absolute;
font-size:34px;
z-index:2;

*{box-sizing:border-box;user-select:none;touch-action:manipulation}
body{margin:0;background:#0a0f1a;color:white;font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;text-align:center;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh}
#game{width:100vw;height:100vh;max-width:550px;max-height:900px;margin:auto;position:relative;background:#010101;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.screen{display:none;position:absolute;inset:0;width:100%;height:100%;z-index:10}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
.start-art{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.7)),url("start-screen.png");background-size:cover;background-position:center 30%;background-repeat:no-repeat;filter:brightness(1.05) drop-shadow(0 0 8px #ff5e5e);z-index:0}
.glow-panel{position:relative;z-index:15;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border-radius:38px;padding:24px 28px;width:84%;max-width:390px;border:1px solid rgba(255,50,50,.6);box-shadow:0 0 30px rgba(255,0,0,.5),inset 0 0 10px rgba(255,200,0,.3)}
h1{font-size:2.25rem;background:linear-gradient(135deg,#ff8a8a,#ff1c1c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 8px #ff0000;letter-spacing:2px;margin:0}
.game-sub{color:#ffcc88;text-shadow:0 0 5px #ff7b2c;font-size:1rem;margin-top:6px}
.transparent-btn{background:rgba(0,0,0,.6);border:2px solid #ff4d4d;border-radius:60px;padding:12px 28px;font-size:1.25rem;font-weight:bold;font-family:inherit;color:white;text-shadow:0 0 5px red;box-shadow:0 0 15px rgba(255,0,0,.7);backdrop-filter:blur(4px);cursor:pointer;margin-top:18px}
.transparent-btn:active{transform:scale(.95);background:rgba(255,60,60,.5)}
#gameplayScreen.active{display:block;padding:0;background:#04100f}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#03030cee;padding:10px 12px;font-size:.95rem;font-weight:bold;border-bottom:2px solid #ff2a2a;position:relative;z-index:20}
#powerupStatus{font-size:.72rem;background:#2c0a0a;padding:4px 8px;border-radius:20px;max-width:150px}
#playArea {
position: relative;
height: calc(100% - 95px);
background-image: url("woods-ground.png");
background-size: cover; 
background-position: center;
background-repeat: no-repeat;
box-shadow: inset 0 0 120px rgba(0,0,0,0.6);
}
.player{position:absolute;width:60px;height:95px;background-image:url("reh-dogg.png");background-size:contain;background-repeat:no-repeat;background-position:center;z-index:30;transition:left .04s linear,top .04s linear}
.enemy{position:absolute;width:38px;height:38px;background:#1f1a2e;border:2px solid #ff3a6f;border-radius:45% 55% 50% 50%;box-shadow:0 0 12px #ff3366;display:flex;align-items:center;justify-content:center;z-index:20}
.enemy::after{content:"👺";font-size:28px;filter:drop-shadow(0 0 2px red)}
.tear{position:absolute;font-size:32px;filter:drop-shadow(0 0 6px cyan);animation:floatSoft 1.2s infinite alternate;pointer-events:none;z-index:15}
.note{position:absolute;font-size:34px;filter:drop-shadow(0 0 5px gold);animation:bounceNote .8s infinite alternate;pointer-events:none;z-index:15}
.powerup{position:absolute;font-size:32px;animation:pulsePower .9s infinite alternate;z-index:18;pointer-events:none}
.tear-trail{position:absolute;font-size:20px;pointer-events:none;animation:tearFall .8s linear forwards;z-index:10}
.player-hit{animation:hitFlash .35s ease}
.touch-panel{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:10px 16px;border-radius:60px;width:fit-content;margin:0 auto 12px auto;z-index:40}
.touch-panel button{width:56px;height:56px;font-size:26px;background:rgba(30,30,40,.85);border:1px solid #ff6666;border-radius:40px;color:white;box-shadow:0 0 12px rgba(255,0,0,.6);cursor:pointer;font-weight:bold}
.touch-panel button:active{transform:scale(.88);background:#ff4d4d}
@keyframes floatSoft{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
@keyframes bounceNote{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.15);opacity:1}}
@keyframes pulsePower{0%{text-shadow:0 0 0 gold;transform:scale(1)}100%{text-shadow:0 0 16px gold;transform:scale(1.2)}}
@keyframes tearFall{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(25px) scale(.6)}}
@keyframes hitFlash{0%{transform:translateX(0);filter:brightness(1)}25%{transform:translateX(-6px);filter:brightness(2)}50%{transform:translateX(6px);filter:brightness(2)}75%{transform:translateX(-4px);filter:brightness(1.5)}100%{transform:translateX(0);filter:brightness(1)}}
@media(max-width:560px){#game{border-radius:0;max-height:none}.glow-panel{width:86%;padding:18px}h1{font-size:1.85rem}.touch-panel button{width:52px;height:52px;font-size:25px}}
</style>
</head>

</div>

function showScreen(screenId){document.querySelectorAll(".screen").forEach(scr=>scr.classList.remove("active"));document.getElementById(screenId).classList.add("active")}
function updateUI(){if(!gameActive)return;document.getElementById("scoreValue").innerText=score;document.getElementById("livesValue").innerText=lives;if(activePowerup){let s=Math.ceil((activePowerup.endTime-Date.now())/1000);document.getElementById("powerupStatus").innerHTML=s>0?`✨ ${activePowerup.type} ${s}s`:"⚡ NORMAL"}else document.getElementById("powerupStatus").innerHTML="⚡ NORMAL"}
function collide(a,b){let r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();return !(r1.top>r2.bottom||r1.bottom<r2.top||r1.right<r2.left||r1.left>r2.right)}
function restorePlayerImage(){if(!playerElement)return;playerElement.style.backgroundImage='url("reh-dogg.png")';playerElement.style.backgroundSize="contain";playerElement.style.backgroundRepeat="no-repeat";playerElement.style.backgroundPosition="center";playerElement.style.boxShadow="";playerElement.style.filter=""}
function removePowerupVisuals(){restorePlayerImage();document.getElementById("powerupStatus").style.background="#2c0a0a"}
function applyPowerupEffect(type){if(type===POWERUP_TYPES.CRYBURST){enemiesArray.forEach(e=>e?.remove());enemiesArray=[];const b=document.createElement("div");b.style.position="absolute";b.style.inset="0";b.style.background="radial-gradient(circle,rgba(255,100,100,.6),transparent)";b.style.pointerEvents="none";b.style.zIndex="100";playArea.appendChild(b);setTimeout(()=>b.remove(),400)}if(type===POWERUP_TYPES.MAXIMO&&playerElement){playerElement.style.boxShadow="0 0 26px gold";playerElement.style.filter="drop-shadow(0 0 18px gold)"}if(type===POWERUP_TYPES.SHOWER&&playerElement){playerElement.style.filter="drop-shadow(0 0 8px cyan)"}}
function spawnPowerup(){if(!gameActive)return;const emojis=["🚿💧","😭💢","👑⭐"],types=[POWERUP_TYPES.SHOWER,POWERUP_TYPES.CRYBURST,POWERUP_TYPES.MAXIMO],idx=Math.floor(Math.random()*types.length);const div=document.createElement("div");div.className="powerup";div.innerText=emojis[idx];div.style.left=Math.random()*(areaWidth-50)+20+"px";div.style.top=Math.random()*(areaHeight-50)+20+"px";div.dataset.type=types[idx];playArea.appendChild(div);powerupsArray.push(div);setTimeout(()=>{if(div?.remove){const i=powerupsArray.indexOf(div);if(i!==-1)powerupsArray.splice(i,1);div.remove()}},7000)}

                }

            }

        }

    });

function checkPowerupCollision(){for(let i=0;i<powerupsArray.length;i++){const p=powerupsArray[i];if(p&&playerElement&&collide(playerElement,p)){const t=p.dataset.type;if(activePowerup){if(powerupTimer)clearTimeout(powerupTimer);removePowerupVisuals()}activePowerup={type:t,endTime:Date.now()+7000};updateUI();applyPowerupEffect(t);if(powerupTimer)clearTimeout(powerupTimer);powerupTimer=setTimeout(()=>{if(activePowerup&&activePowerup.type===t){activePowerup=null;removePowerupVisuals();updateUI()}},7000);p.remove();powerupsArray.splice(i,1);break}}}
function handleEnemyCollisions(){for(let i=0;i<enemiesArray.length;i++){let e=enemiesArray[i];if(e&&playerElement&&collide(playerElement,e)){const inv=(activePowerup&&activePowerup.type===POWERUP_TYPES.MAXIMO);if(!inv){lives--;updateUI();playerElement.classList.add("player-hit");setTimeout(()=>playerElement?.classList.remove("player-hit"),350);if(lives<=0){endGame();return false}}e.remove();enemiesArray.splice(i,1);i--;if(inv){playerElement.style.opacity=".7";setTimeout(()=>{if(playerElement)playerElement.style.opacity="1"},180)}else{playerX=Math.max(10,Math.min(areaWidth-65,playerX-15));playerY=Math.max(10,Math.min(areaHeight-100,playerY-10));playerElement.style.left=playerX+"px";playerElement.style.top=playerY+"px"}break}}return true}

function collectItems(){let m=(activePowerup&&activePowerup.type===POWERUP_TYPES.SHOWER)?2:1;for(let i=0;i<tearsArray.length;i++){let t=tearsArray[i];if(t&&playerElement&&collide(playerElement,t)){score+=10*m;t.remove();tearsArray.splice(i,1);updateUI();i--}}for(let i=0;i<notesArray.length;i++){let n=notesArray[i];if(n&&playerElement&&collide(playerElement,n)){score+=25*m;n.remove();notesArray.splice(i,1);updateUI();i--}}}
function spawnTearTrail(){if(!playerElement||!gameActive)return;const t=document.createElement("div");t.className="tear-trail";t.innerText="💧";t.style.left=(playerX+18)+"px";t.style.top=(playerY+40)+"px";playArea.appendChild(t);setTimeout(()=>t?.remove(),800)}
function movePlayer(dx,dy){if(!gameActive||!playerElement)return;let nx=playerX+dx,ny=playerY+dy;nx=Math.max(12,Math.min(areaWidth-65,nx));ny=Math.max(12,Math.min(areaHeight-100,ny));playerX=nx;playerY=ny;playerElement.style.left=playerX+"px";playerElement.style.top=playerY+"px";spawnTearTrail();checkPowerupCollision();collectItems();if(!handleEnemyCollisions())return;if(lives<=0)endGame()}
function move(dir){const step=26;if(dir==="up")movePlayer(0,-step);if(dir==="down")movePlayer(0,step);if(dir==="left")movePlayer(-step,0);if(dir==="right")movePlayer(step,0)}
function spawnEnemy(){if(!gameActive)return;let e=document.createElement("div");e.className="enemy";e.style.left=Math.random()*(areaWidth-70)+10+"px";e.style.top=Math.random()*(areaHeight-70)+10+"px";playArea.appendChild(e);enemiesArray.push(e);setTimeout(()=>{if(e?.remove){const idx=enemiesArray.indexOf(e);if(idx!==-1)enemiesArray.splice(idx,1);e.remove()}},10000)}

function moveEnemiesTowardPlayer(){if(!gameActive||!playerElement)return;enemiesArray.forEach(e=>{if(!e)return;let ex=parseFloat(e.style.left)||0,ey=parseFloat(e.style.top)||0,dx=playerX-ex,dy=playerY-ey,d=Math.sqrt(dx*dx+dy*dy);if(d>0){let speed=1.4;ex+=(dx/d)*speed;ey+=(dy/d)*speed;e.style.left=ex+"px";e.style.top=ey+"px"}})

function clearGameIntervals(){if(enemyInterval)clearInterval(enemyInterval);if(tearInterval)clearInterval(tearInterval);if(noteInterval)clearInterval(noteInterval);if(powerupInterval)clearInterval(powerupInterval);if(gameLoopInterval)clearInterval(gameLoopInterval);if(powerupTimer)clearTimeout(powerupTimer)}
function resetGameVariables(){score=0;lives=3;enemiesArray.forEach(e=>e?.remove());tearsArray.forEach(t=>t?.remove());notesArray.forEach(n=>n?.remove());powerupsArray.forEach(p=>p?.remove());enemiesArray=[];tearsArray=[];notesArray=[];powerupsArray=[];activePowerup=null;if(powerupTimer)clearTimeout(powerupTimer);restorePlayerImage()}

function endGame(){if(!gameActive)return;gameActive=false;clearGameIntervals();if(activePowerup)removePowerupVisuals();document.getElementById("finalScoreSpan").innerText=score;let music=document.getElementById("bgMusic");if(music){music.pause();music.currentTime=0}showScreen("gameOverScreen")}
document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);
document.querySelectorAll(".touch-panel button").forEach(btn=>{btn.addEventListener("click",e=>{e.stopPropagation();const dir=btn.getAttribute("data-dir");if(dir&&gameActive)move(dir)})});
window.addEventListener("keydown",e=>{if(!gameActive)return;if(e.key==="ArrowUp")move("up");if(e.key==="ArrowDown")move("down");if(e.key==="ArrowLeft")move("left");if(e.key==="ArrowRight")move("right");e.preventDefault()});
