<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Must I Cry: Woods Escape</title>

<style>

body{
margin:0;
background:#050505;
color:white;
font-family:Arial Black,Arial;
text-align:center;
overflow:hidden;
}

.game-shell{
width:100vw;
height:100vh;
max-width:520px;
margin:auto;
position:relative;
overflow:hidden;
}

/* SCREENS */

.screen{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
padding:20px;
}

.screen.is-active{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

/* BACKGROUND */

.forest-layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.75)),
url("start-screen.png");

background-size:contain;
background-position:center;
background-repeat:no-repeat;
background-color:#050505;

z-index:0;
}

/* CONTENT BOX */

.screen-content{
position:relative;
z-index:5;
background:rgba(0,0,0,.35);
padding:24px;
border-radius:18px;
box-shadow:0 0 25px rgba(255,0,0,.45);
width:90%;
max-width:420px;
}

h1{
font-size:38px;
color:#ff1c1c;
text-shadow:
0 0 10px red,
0 0 20px red,
2px 2px black;
}

h2{
font-size:28px;
color:#d4af37;
}

/* BUTTON */

.primary-button{
font-size:20px;
padding:14px 24px;
margin-top:16px;
border:0;
border-radius:14px;
background:#8a0303;
color:white;
box-shadow:0 0 14px red;
cursor:pointer;
}

/* GAME AREA */

.game-screen{
padding:0;
}

.hud{
display:flex;
justify-content:space-around;
background:#111;
padding:10px;
font-size:18px;
}

.maze-wrap{
position:relative;
width:100%;
height:65vh;
display:flex;
align-items:center;
justify-content:center;
}

.maze{
width:92%;
height:65vh;
background:black;
border:2px solid red;
position:relative;
overflow:hidden;
}

.player{
position:absolute;
width:30px;
height:30px;
background:red;
border-radius:50%;
box-shadow:0 0 12px red;
}

.touch-pad{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:grid;
grid-template-columns:60px 60px 60px;
gap:8px;
}

.touch-pad button{
height:54px;
font-size:22px;
border:0;
border-radius:12px;
background:#8a0303;
color:white;
box-shadow:0 0 10px red;
}

</style>
</head>

<body>

<main class="game-shell">

<!-- START SCREEN -->

<section class="screen start-screen is-active" id="start">

<div class="forest-layer"></div>

<div class="screen-content">

<h1>Why Must I Cry</h1>
<h2>Woods Escape</h2>

<p>
Run the moonlit maze, collect glowing tears,
and escape the woods.
</p>

<button class="primary-button"
onclick="showScreen('instructions')">
Start
</button>

</div>

</section>

<!-- INSTRUCTIONS -->

<section class="screen" id="instructions">

<div class="forest-layer"></div>

<div class="screen-content">

<h2>How To Play</h2>

<p>
Use arrow keys or touch buttons to move.
Avoid enemies and survive.
</p>

<button class="primary-button"
onclick="startGame()">
Enter the Woods
</button>

</div>

</section>

<!-- GAME -->

<section class="screen game-screen" id="game">

<header class="hud">

<div>Score: <span id="score">0</span></div>
<div>Lives: <span id="lives">3</span></div>

</header>

<div class="maze-wrap">

<div id="maze" class="maze"></div>

</div>

<nav class="touch-pad">

<button onclick="move('up')">▲</button>
<button onclick="move('left')">◀</button>
<button onclick="move('down')">▼</button>
<button onclick="move('right')">▶</button>

</nav>

<audio id="themeMusic" src="theme.mp3" loop></audio>

</section>

</main>

<script>

let player;
let score=0;
let lives=3;

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("is-active"));

document.getElementById(id)
.classList.add("is-active");

}

function startGame(){

showScreen("game");

score=0;
lives=3;

document.getElementById("score").innerText=score;
document.getElementById("lives").innerText=lives;

let maze=document.getElementById("maze");

maze.innerHTML="";

player=document.createElement("div");

player.className="player";

player.style.left="200px";
player.style.top="200px";

maze.appendChild(player);

document
.getElementById("themeMusic")
.play();

}

function move(dir){

let x=player.offsetLeft;
let y=player.offsetTop;

if(dir==="up") y-=20;
if(dir==="down") y+=20;
if(dir==="left") x-=20;
if(dir==="right") x+=20;

player.style.left=x+"px";
player.style.top=y+"px";

}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") move("up");
if(e.key==="ArrowDown") move("down");
if(e.key==="ArrowLeft") move("left");
if(e.key==="ArrowRight") move("right");

});

</script>

</body>
</html>
