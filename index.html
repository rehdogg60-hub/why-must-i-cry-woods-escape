<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Why Must I Cry: Woods Escape</title>
<style>
.obstacle{position:absolute;font-size:42px;z-index:35;filter:drop-shadow(0 0 6px black)}
*{box-sizing:border-box;user-select:none;touch-action:manipulation}
body{margin:0;background:#0a0f1a;color:white;font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;text-align:center;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh}
#game{width:100vw;height:100vh;max-width:550px;max-height:900px;margin:auto;position:relative;background:#010101;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.screen{display:none;position:absolute;inset:0;width:100%;height:100%;z-index:10}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
.start-art{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.7)),url("start-screen.png");background-size:cover;background-position:center 30%;background-repeat:no-repeat;filter:brightness(1.05) drop-shadow(0 0 8px #ff5e5e);z-index:0}
.glow-panel{position:relative;z-index:15;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border-radius:38px;padding:24px 28px;width:84%;max-width:390px;border:1px solid rgba(255,50,50,.6);box-shadow:0 0 30px rgba(255,0,0,.5),inset 0 0 10px rgba(255,200,0,.3)}
h1{font-size:2.25rem;background:linear-gradient(135deg,#ff8a8a,#ff1c1c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 8px #ff0000;letter-spacing:2px;margin:0}
.game-sub{color:#ffcc88;text-shadow:0 0 5px #ff7b2c;font-size:1rem;margin-top:6px}
.transparent-btn{background:rgba(0,0,0,.6);border:2px solid #ff4d4d;border-radius:60px;padding:12px 28px;font-size:1.25rem;font-weight:bold;font-family:inherit;color:white;text-shadow:0 0 5px red;box-shadow:0 0 15px rgba(255,0,0,.7);backdrop-filter:blur(4px);cursor:pointer;margin-top:18px}
.transparent-btn:active{transform:scale(.95);background:rgba(255,60,60,.5)}
#gameplayScreen.active{display:block;padding:0;background:#04100f}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#03030cee;padding:10px 12px;font-size:.95rem;font-weight:bold;border-bottom:2px solid #ff2a2a;position:relative;z-index:20}
#powerupStatus{font-size:.72rem;background:#2c0a0a;padding:4px 8px;border-radius:20px;max-width:150px}
#playArea{position:relative;height:calc(100% - 95px);background-image:url("woods-ground.png");background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:inset 0 0 120px rgba(0,0,0,.6);overflow:hidden}
.player{position:absolute;width:60px;height:95px;background-image:url("reh-dogg.png");background-size:contain;background-repeat:no-repeat;background-position:center;z-index:30;transition:left .04s linear,top .04s linear}
.enemy{position:absolute;width:38px;height:38px;background:#1f1a2e;border:2px solid #ff3a6f;border-radius:45% 55% 50% 50%;box-shadow:0 0 12px #ff3366;display:flex;align-items:center;justify-content:center;z-index:20}
.enemy::after{content:"👺";font-size:28px;filter:drop-shadow(0 0 2px red)}
.tear{position:absolute;font-size:32px;filter:drop-shadow(0 0 6px cyan);animation:floatSoft 1.2s infinite alternate;pointer-events:none;z-index:15}
.note{position:absolute;font-size:34px;filter:drop-shadow(0 0 5px gold);animation:bounceNote .8s infinite alternate;pointer-events:none;z-index:15}
.powerup{position:absolute;font-size:32px;animation:pulsePower .9s infinite alternate;z-index:18;pointer-events:none}
.tear-trail{position:absolute;font-size:20px;pointer-events:none;animation:tearFall .8s linear forwards;z-index:10}
.player-hit{animation:hitFlash .35s ease}
.score-pop{position:absolute;color:#ffd700;font-weight:bold;font-size:24px;pointer-events:none;animation:scoreRise .9s ease forwards;z-index:80;text-shadow:0 0 6px black,0 0 10px #ff0000}
.touch-panel{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:18px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:10px 16px;border-radius:60px;width:fit-content;margin:0 auto 12px auto;z-index:40}
.touch-panel button{width:72px;height:72px;font-size:30px;background:rgba(30,30,40,.95);border:2px solid #ff6666;border-radius:50px;color:white;box-shadow:0 0 14px rgba(255,0,0,.7);cursor:pointer;font-weight:bold;touch-action:manipulation}
@keyframes scoreRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.2)}}
@keyframes floatSoft{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
@keyframes bounceNote{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.15);opacity:1}}
@keyframes pulsePower{0%{text-shadow:0 0 0 gold;transform:scale(1)}100%{text-shadow:0 0 16px gold;transform:scale(1.2)}}
@keyframes tearFall{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(25px) scale(.6)}}
@keyframes hitFlash{0%{transform:translateX(0);filter:brightness(1)}25%{transform:translateX(-6px);filter:brightness(2)}50%{transform:translateX(6px);filter:brightness(2)}75%{transform:translateX(-4px);filter:brightness(1.5)}100%{transform:translateX(0);filter:brightness(1)}}
@media(max-width:560px){#game{border-radius:0;max-height:none}.glow-panel{width:86%;padding:18px}h1{font-size:1.85rem}.touch-panel button{width:52px;height:52px;font-size:25px}}
</style>
</head>
<body>
<div id="game">
<div id="startScreen" class="screen active"><div class="start-art"></div><div class="glow-panel"><h1>🏕️ WHY MUST I CRY</h1><div class="game-sub">🌲 WOODS ESCAPE 🌲</div><p style="margin:12px 0;font-size:.9rem;">💧 Collect tears & music notes 🎵<br>🚫 Avoid drama enemies 👹<br>✨ Power-ups: Shower Power, Cry Burst, Maximo Mode</p><button class="transparent-btn" id="startBtn">✨ PRESS START ✨</button></div></div>
<div id="gameplayScreen" class="screen"><div id="hud">
<span>💧 SCORE: <span id="scoreValue">0</span></span>
<span>❤️ LIVES: <span id="livesValue">3</span></span>
<span id="powerupStatus">⚡ NORMAL</span>

<button id="pauseBtn"
style="
background:#111;
color:white;
border:2px solid #ff4444;
border-radius:10px;
padding:4px 8px;
font-weight:bold;
cursor:pointer;
">
⏸️
</button>

</div>><span>💧 SCORE: <span id="scoreValue">0</span></span><span>❤️ LIVES: <span id="livesValue">3</span></span><span id="powerupStatus">⚡ NORMAL</span></div><div id="playArea"></div><div class="touch-panel"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><audio id="bgMusic" src="theme.mp3" loop preload="auto"></audio></div>
<div id="gameOverScreen" class="screen"><div class="start-art"></div><div class="glow-panel"><h1 style="color:#ff7777;">💀 GAME OVER 💀</h1><p>🎭 Final Chaos Score: <span id="finalScoreSpan">0</span></p><p style="font-size:.8rem;">"Why must I cry in the woods?"</p><button class="transparent-btn" id="restartBtn">🌲 TRY AGAIN 🌲</button></div></div>
</div>
<script>
let gameActive=false,score=0,lives=3,level=1,enemySpeed=1.4,enemySpawnRate=1900,playerX=200,playerY=200,playerElement=null,playArea=null;
let obstaclesArray=[],obstacleInterval,enemiesArray=[],tearsArray=[],notesArray=[],powerupsArray=[];
let enemyInterval,tearInterval,noteInterval,powerupInterval,gameLoopInterval,activePowerup=null,powerupTimer=null,areaWidth=0,areaHeight=0;
const POWERUP_TYPES={SHOWER:"💧💥 SHOWER POWER",CRYBURST:"😭💢 CRY BURST",MAXIMO:"👑 MAXIMO MODE"};
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function updateUI(){if(!gameActive)return;level=Math.floor(score/200)+1;enemySpeed=1.4+(level-1)*0.3;document.getElementById("scoreValue").innerText=score;document.getElementById("livesValue").innerText=lives;if(activePowerup){let s=Math.ceil((activePowerup.endTime-Date.now())/1000);document.getElementById("powerupStatus").innerHTML=s>0?`✨ ${activePowerup.type} ${s}s`:"⚡ NORMAL"}else{document.getElementById("powerupStatus").innerHTML="⚡ NORMAL"}}
function collide(a,b){let r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();return !(r1.top>r2.bottom||r1.bottom<r2.top||r1.right<r2.left||r1.left>r2.right)}
function restorePlayerImage(){if(!playerElement)return;playerElement.style.backgroundImage='url("reh-dogg.png")';playerElement.style.backgroundSize="contain";playerElement.style.backgroundRepeat="no-repeat";playerElement.style.backgroundPosition="center";playerElement.style.boxShadow="";playerElement.style.filter=""}
function removePowerupVisuals(){restorePlayerImage();document.getElementById("powerupStatus").style.background="#2c0a0a"}
function applyPowerupEffect(type){if(type===POWERUP_TYPES.CRYBURST){enemiesArray.forEach(e=>e?.remove());enemiesArray=[];let b=document.createElement("div");b.style.position="absolute";b.style.inset="0";b.style.background="radial-gradient(circle,rgba(255,100,100,.6),transparent)";b.style.pointerEvents="none";b.style.zIndex="100";playArea.appendChild(b);setTimeout(()=>b.remove(),400)}if(type===POWERUP_TYPES.MAXIMO&&playerElement){playerElement.style.boxShadow="0 0 26px gold";playerElement.style.filter="drop-shadow(0 0 18px gold)"}if(type===POWERUP_TYPES.SHOWER&&playerElement){playerElement.style.filter="drop-shadow(0 0 8px cyan)"}}
function spawnPowerup(){if(!gameActive)return;let emojis=["🚿💧","😭💢","👑⭐"],types=[POWERUP_TYPES.SHOWER,POWERUP_TYPES.CRYBURST,POWERUP_TYPES.MAXIMO],idx=Math.floor(Math.random()*types.length);let d=document.createElement("div");d.className="powerup";d.innerText=emojis[idx];d.style.left=Math.random()*(areaWidth-50)+20+"px";d.style.top=Math.random()*(areaHeight-50)+20+"px";d.dataset.type=types[idx];playArea.appendChild(d);powerupsArray.push(d);setTimeout(()=>{if(d?.remove){let i=powerupsArray.indexOf(d);if(i!==-1)powerupsArray.splice(i,1);d.remove()}},7000)}
function checkPowerupCollision(){for(let i=0;i<powerupsArray.length;i++){let p=powerupsArray[i];if(p&&playerElement&&collide(playerElement,p)){let t=p.dataset.type;if(activePowerup){if(powerupTimer)clearTimeout(powerupTimer);removePowerupVisuals()}activePowerup={type:t,endTime:Date.now()+7000};updateUI();applyPowerupEffect(t);if(powerupTimer)clearTimeout(powerupTimer);powerupTimer=setTimeout(()=>{if(activePowerup&&activePowerup.type===t){activePowerup=null;removePowerupVisuals();updateUI()}},7000);p.remove();powerupsArray.splice(i,1);break}}}
function playerHit(){lives--;updateUI();if(playerElement){playerElement.classList.add("player-hit");setTimeout(()=>playerElement?.classList.remove("player-hit"),350)}if(lives<=0){endGame();return false}return true}
function handleEnemyCollisions(){for(let i=0;i<enemiesArray.length;i++){let e=enemiesArray[i];if(e&&playerElement&&collide(playerElement,e)){let inv=activePowerup&&activePowerup.type===POWERUP_TYPES.MAXIMO;e.remove();enemiesArray.splice(i,1);if(inv){playerElement.style.opacity=".7";setTimeout(()=>{if(playerElement)playerElement.style.opacity="1"},180);return true}return playerHit()}}return true}
function handleObstacleCollisions(){for(let i=0;i<obstaclesArray.length;i++){let o=obstaclesArray[i];if(o&&playerElement&&collide(playerElement,o)){let inv=activePowerup&&activePowerup.type===POWERUP_TYPES.MAXIMO;o.remove();obstaclesArray.splice(i,1);if(inv)return true;return playerHit()}}return true}
function showScorePop(amount){if(!playerElement||!playArea)return;let pop=document.createElement("div");pop.className="score-pop";pop.innerText="+"+amount;pop.style.left=(playerX+20)+"px";pop.style.top=(playerY)+"px";playArea.appendChild(pop);setTimeout(()=>{if(pop?.remove)pop.remove()},900)}
function collectItems(){let m=(activePowerup&&activePowerup.type===POWERUP_TYPES.SHOWER)?2:1;for(let i=0;i<tearsArray.length;i++){let t=tearsArray[i];if(t&&playerElement&&collide(playerElement,t)){let gain=10*m;score+=gain;showScorePop(gain);t.remove();tearsArray.splice(i,1);updateUI();i--}}for(let i=0;i<notesArray.length;i++){let n=notesArray[i];if(n&&playerElement&&collide(playerElement,n)){let gain=25*m;score+=gain;showScorePop(gain);n.remove();notesArray.splice(i,1);updateUI();i--}}}
function spawnTearTrail(){if(!playerElement||!gameActive)return;let t=document.createElement("div");t.className="tear-trail";t.innerText="💧";t.style.left=(playerX+18)+"px";t.style.top=(playerY+40)+"px";playArea.appendChild(t);setTimeout(()=>t?.remove(),800)}
function movePlayer(dx,dy){if(!gameActive||!playerElement)return;playerX=Math.max(12,Math.min(areaWidth-65,playerX+dx));playerY=Math.max(12,Math.min(areaHeight-100,playerY+dy));playerElement.style.left=playerX+"px";playerElement.style.top=playerY+"px";spawnTearTrail();checkPowerupCollision();collectItems();if(!handleEnemyCollisions())return;if(!handleObstacleCollisions())return;if(lives<=0)endGame()}
function move(dir){let step=26;if(dir==="up")movePlayer(0,-step);if(dir==="down")movePlayer(0,step);if(dir==="left")movePlayer(-step,0);if(dir==="right")movePlayer(step,0)}
function spawnEnemy(){if(!gameActive)return;let e=document.createElement("div");e.className="enemy";e.style.left=Math.random()*(areaWidth-70)+10+"px";e.style.top=Math.random()*(areaHeight-70)+10+"px";playArea.appendChild(e);enemiesArray.push(e);setTimeout(()=>{if(e?.remove){let i=enemiesArray.indexOf(e);if(i!==-1)enemiesArray.splice(i,1);e.remove()}},10000)}
function spawnObstacle(){if(!gameActive)return;let types=["🌲","🪨","🪵"];let o=document.createElement("div");o.className="obstacle";o.textContent=types[Math.floor(Math.random()*types.length)];o.style.left=Math.random()*(areaWidth-70)+10+"px";o.style.top=Math.random()*(areaHeight-70)+10+"px";playArea.appendChild(o);obstaclesArray.push(o);setTimeout(()=>{if(o?.remove){let i=obstaclesArray.indexOf(o);if(i!==-1)obstaclesArray.splice(i,1);o.remove()}},10000)}
function spawnTear(){if(!gameActive)return;let t=document.createElement("div");t.className="tear";t.innerText="💧";t.style.left=Math.random()*(areaWidth-50)+10+"px";t.style.top=Math.random()*(areaHeight-50)+10+"px";playArea.appendChild(t);tearsArray.push(t);setTimeout(()=>{if(t?.remove){let i=tearsArray.indexOf(t);if(i!==-1)tearsArray.splice(i,1);t.remove()}},8000)}
function spawnNote(){if(!gameActive)return;let n=document.createElement("div");n.className="note";n.innerText="🎵";n.style.left=Math.random()*(areaWidth-50)+10+"px";n.style.top=Math.random()*(areaHeight-50)+10+"px";playArea.appendChild(n);notesArray.push(n);setTimeout(()=>{if(n?.remove){let i=notesArray.indexOf(n);if(i!==-1)notesArray.splice(i,1);n.remove()}},8000)}
function moveEnemiesTowardPlayer(){if(!gameActive||!playerElement)return;enemiesArray.forEach(e=>{if(!e)return;let ex=parseFloat(e.style.left)||0,ey=parseFloat(e.style.top)||0,dx=playerX-ex,dy=playerY-ey,d=Math.sqrt(dx*dx+dy*dy);if(d>0){ex+=(dx/d)*enemySpeed;ey+=(dy/d)*enemySpeed;e.style.left=ex+"px";e.style.top=ey+"px"}})}
function clearGameIntervals(){if(enemyInterval)clearInterval(enemyInterval);if(tearInterval)clearInterval(tearInterval);if(noteInterval)clearInterval(noteInterval);if(powerupInterval)clearInterval(powerupInterval);if(obstacleInterval)clearInterval(obstacleInterval);if(gameLoopInterval)clearInterval(gameLoopInterval);if(powerupTimer)clearTimeout(powerupTimer)}
function resetGameVariables(){score=0;lives=3;enemiesArray.forEach(e=>e?.remove());tearsArray.forEach(t=>t?.remove());notesArray.forEach(n=>n?.remove());powerupsArray.forEach(p=>p?.remove());obstaclesArray.forEach(o=>o?.remove());enemiesArray=[];tearsArray=[];notesArray=[];powerupsArray=[];obstaclesArray=[];activePowerup=null;if(powerupTimer)clearTimeout(powerupTimer);restorePlayerImage()}
function startGame(){clearGameIntervals();gameActive=true;resetGameVariables();showScreen("gameplayScreen");playArea=document.getElementById("playArea");playArea.innerHTML="";let r=playArea.getBoundingClientRect();areaWidth=r.width;areaHeight=r.height;playerX=areaWidth/2-30;playerY=areaHeight/2-47;playerElement=document.createElement("div");playerElement.className="player";playerElement.style.left=playerX+"px";playerElement.style.top=playerY+"px";playArea.appendChild(playerElement);updateUI();enemyInterval=setInterval(spawnEnemy,1900);obstacleInterval=setInterval(spawnObstacle,1500);spawnObstacle();spawnObstacle();tearInterval=setInterval(spawnTear,1300);noteInterval=setInterval(spawnNote,1700);powerupInterval=setInterval(spawnPowerup,11000);gameLoopInterval=setInterval(()=>{if(!gameActive)return;moveEnemiesTowardPlayer();checkPowerupCollision();collectItems();handleEnemyCollisions();handleObstacleCollisions();if(lives<=0)endGame();updateUI()},100);let music=document.getElementById("bgMusic");music.volume=.5;music.currentTime=0;music.play().catch(()=>{})}
function endGame(){if(!gameActive)return;gameActive=false;clearGameIntervals();if(activePowerup)removePowerupVisuals();document.getElementById("finalScoreSpan").innerText=score;let music=document.getElementById("bgMusic");if(music){music.pause();music.currentTime=0}showScreen("gameOverScreen")}
document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);
document.querySelectorAll(".touch-panel button").forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();let dir=btn.getAttribute("data-dir");if(dir&&gameActive)move(dir)}));
window.addEventListener("keydown",e=>{if(!gameActive)return;if(e.key==="ArrowUp")move("up");if(e.key==="ArrowDown")move("down");if(e.key==="ArrowLeft")move("left");if(e.key==="ArrowRight")move("right");e.preventDefault()});
window.addEventListener("resize",()=>{if(playArea&&playerElement&&gameActive){let r=playArea.getBoundingClientRect();areaWidth=r.width;areaHeight=r.height;playerX=Math.min(areaWidth-65,Math.max(12,playerX));playerY=Math.min(areaHeight-100,Math.max(12,playerY));playerElement.style.left=playerX+"px";playerElement.style.top=playerY+"px"}});
</script>
</body>
</html>
