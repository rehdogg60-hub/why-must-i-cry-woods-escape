<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Must I Cry: Woods Escape</title>

<style>

body{
margin:0;
background:#050505;
color:white;
font-family:Arial Black,Arial;
text-align:center;
overflow:hidden;
}

#game{
width:100vw;
height:100vh;
max-width:520px;
margin:auto;
position:relative;
overflow:hidden;
}

/* SCREENS */

.screen{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
padding:20px;
}

.active{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

/* BACKGROUND */

.forest{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.75)),
url("start-screen.png");

background-size:contain;
background-position:center;
background-repeat:no-repeat;

z-index:0;
}

/* CONTENT BOX */

.content{
position:relative;
z-index:5;
background:rgba(0,0,0,.25);
padding:24px;
border-radius:18px;
box-shadow:0 0 25px red;
width:90%;
max-width:420px;
}

/* TITLE */

h1{
font-size:40px;
color:#ff1c1c;
text-shadow:
0 0 10px red,
0 0 20px red,
2px 2px black;
}

h2{
color:#d4af37;
}

/* BUTTON */

button{
font-size:20px;
padding:14px 24px;
margin-top:16px;

border:2px solid #ff1c1c;
border-radius:14px;

background:rgba(0,0,0,0.25);
color:white;

box-shadow:
0 0 10px red,
0 0 20px red;

cursor:pointer;
}

/* HUD */

#hud{
display:flex;
justify-content:space-around;
background:#111;
padding:10px;
font-size:18px;
}

/* PLAY AREA */

#playArea{
position:relative;
height:70vh;
border-top:2px solid red;
border-bottom:2px solid red;
overflow:hidden;
background:#050505;
}

.player{
position:absolute;
width:30px;
height:30px;
background:red;
border-radius:50%;
box-shadow:0 0 12px red;
}

.enemy{
position:absolute;
width:28px;
height:28px;
background:black;
border:2px solid red;
border-radius:50%;
}

.tear{
position:absolute;
font-size:24px;
}

.note{
position:absolute;
font-size:24px;
}

/* TOUCH CONTROLS */

.touch{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:grid;
grid-template-columns:60px 60px 60px;
gap:8px;
}

.touch button{
height:50px;
font-size:22px;
}

</style>
</head>

<body>

<div id="game">

<!-- START -->

<div id="start" class="screen active">

<div class="forest"></div>

<div class="content">

<h1>Why Must I Cry</h1>
<h2>Woods Escape</h2>

<p>
Run through the woods.<br>
Collect tears.<br>
Escape the drama.
</p>

<button onclick="startGame()">
Start Game
</button>

</div>

</div>

<!-- GAME -->

<div id="playing" class="screen">

<div id="hud">

<div>Score: <span id="score">0</span></div>
<div>Lives: <span id="lives">3</span></div>

</div>

<div id="playArea"></div>

<div class="touch">

<button onclick="move('up')">▲</button>
<button onclick="move('left')">◀</button>
<button onclick="move('down')">▼</button>
<button onclick="move('right')">▶</button>

</div>

<audio id="music" src="theme.mp3" loop></audio>

</div>

<!-- GAME OVER -->

<div id="end" class="screen">

<div class="forest"></div>

<div class="content">

<h1>Game Over</h1>

<p>
Final Score:
<span id="final">0</span>
</p>

<button onclick="startGame()">
Play Again
</button>

</div>

</div>

</div>

<script>

let player
let score=0
let lives=3
let enemies=[]
let tears=[]
let notes=[]

function show(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"))

document.getElementById(id)
.classList.add("active")

}

function startGame(){

show("playing")

score=0
lives=3

document.getElementById("score").innerText=score
document.getElementById("lives").innerText=lives

let area=document.getElementById("playArea")

area.innerHTML=""

player=document.createElement("div")

player.className="player"

player.style.left="200px"
player.style.top="200px"

area.appendChild(player)

document.getElementById("music").play()

setInterval(spawnEnemy,2000)
setInterval(spawnTear,1500)
setInterval(spawnNote,2500)

}

function move(dir){

let x=player.offsetLeft
let y=player.offsetTop

if(dir==="up") y-=20
if(dir==="down") y+=20
if(dir==="left") x-=20
if(dir==="right") x+=20

player.style.left=x+"px"
player.style.top=y+"px"

checkCollisions()

}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") move("up")
if(e.key==="ArrowDown") move("down")
if(e.key==="ArrowLeft") move("left")
if(e.key==="ArrowRight") move("right")

})

function spawnEnemy(){

let area=document.getElementById("playArea")

let enemy=document.createElement("div")

enemy.className="enemy"

enemy.style.left=Math.random()*400+"px"
enemy.style.top=Math.random()*400+"px"

area.appendChild(enemy)

enemies.push(enemy)

}

function spawnTear(){

let area=document.getElementById("playArea")

let tear=document.createElement("div")

tear.className="tear"

tear.innerText="💧"

tear.style.left=Math.random()*400+"px"
tear.style.top=Math.random()*400+"px"

area.appendChild(tear)

tears.push(tear)

}

function spawnNote(){

let area=document.getElementById("playArea")

let note=document.createElement("div")

note.className="note"

note.innerText="🎵"

note.style.left=Math.random()*400+"px"
note.style.top=Math.random()*400+"px"

area.appendChild(note)

notes.push(note)

}

function checkCollisions(){

tears.forEach(t=>{

if(collide(player,t)){

score+=10

document.getElementById("score").innerText=score

t.remove()

}

})

notes.forEach(n=>{

if(collide(player,n)){

score+=25

document.getElementById("score").innerText=score

n.remove()

}

})

enemies.forEach(e=>{

if(collide(player,e)){

lives--

document.getElementById("lives").innerText=lives

e.remove()

if(lives<=0){

endGame()

}

}

})

}

function collide(a,b){

let r1=a.getBoundingClientRect()

let r2=b.getBoundingClientRect()

return !(
r1.top>r2.bottom ||
r1.bottom<r2.top ||
r1.right<r2.left ||
r1.left>r2.right
)

}

function endGame(){

document.getElementById("final").innerText=score

show("end")

}

</script>

</body>
</html>
